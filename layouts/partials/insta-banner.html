<style>
  #insta-banner {
    display: none;
    position: fixed;
    /* sits above the nav bar on mobile (nav is top), below on desktop (nav is bottom) */
    top: 2rem;
    left: 0;
    right: 0;
    z-index: 799; /* just under --z-nav: 800 */
    background: white;
    color: black;
    text-align: center;
    padding: 0 0.625rem;
    height: 2rem;
    line-height: 2rem;
    font-size: 13px;
    font-family: 'Geist', sans-serif;
    border-bottom: 1px solid #e8e8e8;
  }
  #insta-banner button {
    background: none;
    border: none;
    padding: 0 0 0 0.75rem;
    font-size: 13px;
    font-family: 'Geist', sans-serif;
    cursor: pointer;
    color: #888;
  }
  @media (min-width: 768px) {
    /* on desktop the nav is at the bottom, so put banner above bottom nav */
    #insta-banner {
      top: auto;
      bottom: 2rem;
      border-bottom: none;
      border-top: 1px solid #e8e8e8;
    }
  }
</style>
<div id="insta-banner">
  tap <strong>···</strong> then <strong>open in browser</strong> for best experience
  <button onclick="document.getElementById('insta-banner').style.display='none'">✕</button>
</div>
<script>
  if (/Instagram/.test(navigator.userAgent)) {
    document.getElementById('insta-banner').style.display = 'block';
  }
</script>
